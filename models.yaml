# Model registry shared by all benchmarks.
# Each entry is referenced by its alias (the key) in `bench new/add --models ...`.
# When a model is added to a benchmark, its fully merged definition is frozen into that
# benchmark's config.yaml, so editing this file later never changes existing results.
#
# Common fields:
#   provider:     ollama | openrouter
#   model:        model name as the provider knows it
#   temperature:  overrides the benchmark's temperature (null = provider/model default)
#   max_tokens:   overrides the benchmark's max_tokens (null = no explicit limit)
#   timeout:      seconds of silence before a request fails (keep-alive bytes reset it)
#   max_duration: total seconds per attempt; a reply still running then counts as truncated
#   concurrency:  parallel requests for this model (default: ollama 1, openrouter 4)
#   extra:        dict merged verbatim into the request body
# Ollama-only:
#   think:        true/false, or "low"/"medium"/"high" for models like gpt-oss
#   options:      Ollama options (num_ctx, top_p, ...); num_ctx matters for long thinking
#   base_url:     defaults to $OLLAMA_HOST or http://localhost:11434
# OpenRouter-only:
#   reasoning:    OpenRouter reasoning object, e.g. {effort: high}
#   routing:      OpenRouter `provider` object, e.g. {order: [DeepSeek], allow_fallbacks: false}

# Defaults merged into every model of that provider (model entries win).
defaults:
  ollama:
    think: true
    timeout: 3600
    max_duration: 3600  # stops reasoning loops; a reply still running then counts as truncated
    options:
      num_ctx: 65536    # prompt + reasoning + answer; cloud replies up to ~96k tokens still finished
  openrouter:
    timeout: 600
    max_duration: 1800  # stops runaway reasoning loops (some hosts allow 900k+ output tokens)
    concurrency: 10

models:
  # --- Local (Ollama) ---
  ollama-bonsai-2-2b:            {provider: ollama, model: "bonsai-2:2b"}
  ollama-bonsai-2-9b:            {provider: ollama, model: "bonsai-2:9b"}
  ollama-bonsai-2-27b:           {provider: ollama, model: "bonsai-2:27b"}
  ollama-flint:                  {provider: ollama, model: "flint:latest"}
  ollama-gemma4-e4b:             {provider: ollama, model: "gemma4:e4b"}
  ollama-gemma4-26b:             {provider: ollama, model: "gemma4:26b"}
  ollama-gpt-oss-20b:            {provider: ollama, model: "gpt-oss:20b", think: high}
  ollama-lfm2.5-8b:              {provider: ollama, model: "lfm2.5:8b"}
  ollama-lfm2.5-24b:             {provider: ollama, model: "lfm2.5:24b"}
  ollama-mimo-v2.6:              {provider: ollama, model: "mimo-v2.6:latest"}
  ollama-nemotron-3.5-lightning: {provider: ollama, model: "nemotron-3.5-lightning:latest"}
  ollama-ornith-1.5-9b:          {provider: ollama, model: "ornith-1.5:9b"}
  ollama-qwen3.8:                {provider: ollama, model: "qwen3.8:latest"}
  
  # --- Cloud (OpenRouter) ---
  # reasoning: {effort: high} only where hosts accept an effort level; elsewhere {enabled: true}
  # just makes sure thinking is switched on. routing: hosts checked 2026-11-07 via
  # https://openrouter.ai/api/v1/models/<id>/endpoints, preferring full precision (bf16/fp16)
  # and large max output; allow_fallbacks: false means only the listed hosts are ever used.
  or-bonsai-2-9b:                # single host (ternary model, int4 is its native-ish format)
    {provider: openrouter, model: "prism-ml/ternary-bonsai-2-9b", reasoning: {enabled: true},
     routing: {order: ["darkbloom/int4"], allow_fallbacks: false}}
  or-bonsai-2-27b:               # single host
    {provider: openrouter, model: "prism-ml/ternary-bonsai-2-27b", reasoning: {effort: high},
     routing: {order: ["darkbloom/int4"], allow_fallbacks: false}}
  or-claude-haiku-5.5:           # proprietary: identical weights on every host, so several are listed
    {provider: openrouter, model: "anthropic/claude-haiku-5.5", reasoning: {effort: high},
     routing: {order: ["anthropic", "amazon-bedrock", "google-vertex/global"], allow_fallbacks: false}}
  or-flint:                      # free tier: rate limited (~20 req/min, daily cap), single host
    {provider: openrouter, model: "recursive/flint-v1.0:free", reasoning: {enabled: true},
     concurrency: 2, routing: {order: ["recursive/bf16"], allow_fallbacks: false}}
  or-gemini-3.8-flash:           # proprietary; "google-ai-studio/flex" is half price but may queue
    {provider: openrouter, model: "google/gemini-3.8-flash", reasoning: {effort: high},
     routing: {order: ["google-ai-studio", "google-vertex/global"], allow_fallbacks: false}}
  or-gemma-4-26b:
    {provider: openrouter, model: "google/gemma-4-26b-a4b-it", reasoning: {enabled: true},
     routing: {order: ["coreweave/bf16", "parasail/bf16", "novita/bf16"], allow_fallbacks: false}}
  or-glm-5.3-flash:              # no bf16 hosts; fp8 from Z.ai itself first (cheapest hosts are fp4)
    {provider: openrouter, model: "z-ai/glm-5.3-flash", reasoning: {effort: high},
     routing: {order: ["z-ai/fp8", "baseten/fp8", "novita/fp8"], allow_fallbacks: false}}
  or-gpt-6-luna:               # proprietary; "openai/flex" is half price but may queue
    {provider: openrouter, model: "openai/gpt-6-luna", reasoning: {effort: high},
     routing: {order: ["openai", "azure"], allow_fallbacks: false}}
  or-gpt-oss-20b:
    {provider: openrouter, model: "openai/gpt-oss-20b", reasoning: {effort: high},
     routing: {order: ["deepinfra/bf16", "dekallm/bf16"], allow_fallbacks: false}}
  or-gpt-oss-120b:
    {provider: openrouter, model: "openai/gpt-oss-120b", reasoning: {effort: high},
     routing: {order: ["deepinfra/bf16", "dekallm/bf16", "crusoe/bf16"], allow_fallbacks: false}}
  or-lfm2.5-24b:                 # single host (Liquid itself); NOTE max output only 8192 tokens
    {provider: openrouter, model: "liquid/lfm-2.5-24b-a2b", reasoning: {enabled: true},
     routing: {order: ["liquid/fp8"], allow_fallbacks: false}}
  or-mimo-v2.6-flash:            # reasoning optional, no effort levels; GMICloud is the only bf16 host
    {provider: openrouter, model: "xiaomi/mimo-v2.6-flash", reasoning: {enabled: true},
     routing: {order: ["gmicloud/bf16", "xiaomi/fp8", "deepinfra/fp8"], allow_fallbacks: false}}
  or-nemotron-3.5-lightning:
    {provider: openrouter, model: "nvidia/nemotron-3.5-lightning", reasoning: {enabled: true},
     routing: {order: ["coreweave/bf16", "deepinfra/bf16"], allow_fallbacks: false}}
  or-qwen3.8:
    {provider: openrouter, model: "qwen/qwen3.8-27b", reasoning: {effort: high},
     routing: {order: ["deepinfra/bf16", "cerebras/fp16"], allow_fallbacks: false}}
