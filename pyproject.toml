[project]
name = "ai-benchmarks"
version = "0.1.0"
description = "Personal benchmarks for local (Ollama) and cloud (OpenRouter) models"
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "pyyaml>=6"]

[project.scripts]
bench = "core.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["core", "SimpleBench"]
